<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CLAUDEBOD">
  <meta name="description" content="Hybrid Hypertrophy + Olympic Lifting Coach">

  <title>CLAUDEBOD</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="app">

    <!-- Main scrollable content area -->
    <div id="main-content" role="main" aria-live="polite">
      <div class="loading-screen">
        <div class="loading-logo">CLAUDEBOD</div>
        <div class="loading-sub">Loading...</div>
      </div>
    </div>

    <!-- Rest Timer Bar (sits above nav) -->
    <div id="timer-bar" class="hidden" role="timer" aria-label="Rest timer">
      <div id="timer-progress"></div>
      <span id="timer-label">REST 3:00</span>
      <span class="timer-dismiss">TAP TO SKIP</span>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
      <button class="nav-btn active" data-tab="today" aria-label="Today's workout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        TODAY
      </button>
      <button class="nav-btn" data-tab="history" aria-label="Workout history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        HISTORY
      </button>
      <button class="nav-btn" data-tab="progress" aria-label="Progress tracking">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        PROGRESS
      </button>
    </nav>

    <!-- Install to Home Screen Button -->
    <button class="install-btn hidden" id="install-btn" aria-label="Install app">
      ⊕ ADD TO HOME SCREEN
    </button>

  </div>

  <style>
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 50vh;
    }
    .loading-logo {
      font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
      font-size: 42px;
      font-weight: 900;
      color: #C8F55A;
      letter-spacing: 0.08em;
    }
    .loading-sub {
      font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
      font-size: 14px;
      color: #555;
      letter-spacing: 0.1em;
      margin-top: 8px;
    }
  </style>

  <!-- Load scripts in dependency order -->
  <script src="./js/data.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/timer.js"></script>
  <script src="./js/session.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
